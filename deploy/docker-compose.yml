services:
  app:
    build: ..
    ports:
      - "${APP_BIND_IP}:8081:8080"
    env_file: ${ENV_FILE:-.env}
    volumes:
      - files:/data/files
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:18.6
    env_file: ${ENV_FILE:-.env}
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  db-data:
  files:
