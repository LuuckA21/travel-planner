name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Testcontainers uses the Docker daemon of the runner.
      - run: ./mvnw -B verify
        working-directory: backend

  deploy-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck -x ./*.sh
        working-directory: deploy
      - run: bash deploy/update-test.sh

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --run
      - run: npm run build

  e2e:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo "SMOKE_DIR=$RUNNER_TEMP/smoke" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Start the stack and smoke-test it
        run: bash deploy/smoke-test.sh --keep
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run e2e
        working-directory: frontend
      - name: Upload Playwright results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: frontend/test-results
          if-no-files-found: ignore
      - name: App logs
        if: failure()
        # The smoke script deletes its env file when it fails itself.
        run: '[ ! -f "$SMOKE_DIR/env" ] || ENV_FILE="$SMOKE_DIR/env" docker compose -p tp-smoke --env-file "$SMOKE_DIR/env" -f deploy/docker-compose.yml logs app'
      - name: Stop the stack
        if: always()
        run: '[ ! -f "$SMOKE_DIR/env" ] || ENV_FILE="$SMOKE_DIR/env" docker compose -p tp-smoke --env-file "$SMOKE_DIR/env" -f deploy/docker-compose.yml down -v'
