spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  mail:
    host: ${SMTP_HOST}
    port: ${SMTP_PORT}
    username: ${SMTP_USER}
    password: ${SMTP_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

app:
  registration-open: ${APP_REGISTRATION_OPEN:false}
  base-url: ${APP_BASE_URL}
  mail-from: ${MAIL_FROM}
  storage-dir: /data/files
